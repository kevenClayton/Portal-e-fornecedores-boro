name: Build Windows EXE

on:
  workflow_dispatch:
    inputs:
      cliente:
        description: "Nome do cliente (aparece no artefato)"
        required: true
        default: "madeforte"
      env_file_name:
        description: "Arquivo .env na pasta portal-playwright (opcional se usar Secrets)"
        required: false
        default: ".env"

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: portal-playwright

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-build.txt

      - name: Gerar config embutida a partir dos Secrets
        env:
          CLIENTE: ${{ inputs.cliente }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          PORTAL_URL: ${{ secrets.PORTAL_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          USAR_CHROME_SISTEMA: "true"
          HEADLESS: "false"
        run: |
          python scripts/gerar_config_embutida.py --env-file "${{ inputs.env_file_name }}"

      - name: PyInstaller
        run: pyinstaller --noconfirm portal.spec

      - name: Renomear artefato
        shell: pwsh
        run: |
          $nome = "PortalFornecedores-${{ inputs.cliente }}.exe"
          Copy-Item "dist\PortalFornecedores.exe" "dist\$nome"
          Get-ChildItem dist

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: PortalFornecedores-${{ inputs.cliente }}
          path: portal-playwright/dist/PortalFornecedores-${{ inputs.cliente }}.exe
          if-no-files-found: error
