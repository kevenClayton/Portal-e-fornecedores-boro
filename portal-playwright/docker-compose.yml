# Stack para Portainer (Stacks → Add stack → Web editor ou Git repository)
#
# 1. Cole este arquivo no Portainer
# 2. Em "Environment variables", preencha DB_* e PROXY
# 3. Deploy the stack
# 4. Start/Stop pelo Portainer

services:
  portal-fornecedores:
    build:
      context: .
      dockerfile: Dockerfile
    image: portal-fornecedores:latest
    container_name: portal-fornecedores
    restart: unless-stopped

    # Chrome em container precisa de /dev/shm maior
    shm_size: "512mb"

    environment:
      CLIENTE: ${CLIENTE:-madeforte}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      PORTAL_URL: ${PORTAL_URL:-https://portal.e-fornecedores.ind.br/}
      PROXY: ${PROXY:-}
      HEADLESS: ${HEADLESS:-true}
      USAR_CHROME_SISTEMA: "false"
      DOCKER: "true"
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      TEMPO_ESPERA: ${TEMPO_ESPERA:-30}

    volumes:
      - portal_logs:/app/logs

    # Opcional: argumentos extras do robô
    # command: ["python", "run.py", "--tempo-espera", "30"]

volumes:
  portal_logs:
