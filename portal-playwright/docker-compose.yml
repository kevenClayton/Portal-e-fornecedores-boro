# Stack para Portainer (Stacks → Add stack → Web editor ou Git repository)
#
# 1. Cole este arquivo no Portainer
# 2. Em "Environment variables", preencha DB_* e PROXY
# 3. Deploy the stack
# 4. Start/Stop pelo Portainer

services:
  portal-fornecedores:
    build:
      context: .
      dockerfile: Dockerfile
    image: portal-fornecedores:latest
    container_name: portal-fornecedores
    restart: unless-stopped

    # Chrome em container precisa de /dev/shm maior
    shm_size: "512mb"

    environment:
      CLIENTE: ${CLIENTE:-madeforte}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      PORTAL_URL: ${PORTAL_URL:-https://portal.e-fornecedores.ind.br/}
      PROXY: ${PROXY:-}
      # Chrome real no container — portal rejeita Chromium Playwright
      USAR_CHROME_SISTEMA: ${USAR_CHROME_SISTEMA:-true}
      # Headed via Xvfb — headless costuma falhar no reCAPTCHA v3 do portal
      HEADLESS: ${HEADLESS:-false}
      DOCKER: "true"
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      TEMPO_ESPERA: ${TEMPO_ESPERA:-30}

    volumes:
      - portal_logs:/app/logs

  painel:
    build:
      context: ./painel
      dockerfile: Dockerfile
    image: portal-fornecedores-painel:latest
    container_name: portal-fornecedores-painel
    restart: unless-stopped
    ports:
      - "${PAINEL_PORT:-8080}:8080"
    environment:
      APP_NAME: "Portal Fornecedores"
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${PAINEL_APP_KEY}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${PAINEL_APP_URL:-http://localhost:8080}
      DB_CONNECTION: mysql
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_NAME}
      DB_USERNAME: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      SESSION_DRIVER: file
      CACHE_STORE: file
      ROBO_PORTAINER_URL: ${ROBO_PORTAINER_URL:-}
      ROBO_PORTAINER_API_KEY: ${ROBO_PORTAINER_API_KEY:-}
      ROBO_PORTAINER_ENDPOINT_ID: ${ROBO_PORTAINER_ENDPOINT_ID:-1}
      ROBO_CONTAINER_NAME: ${ROBO_CONTAINER_NAME:-portal-fornecedores}
      # Se o painel rodar na mesma EC2 do Docker do robô:
      ROBO_USAR_DOCKER_CLI: ${ROBO_USAR_DOCKER_CLI:-true}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@madeforte.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123456}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - painel_storage:/var/www/html/storage

volumes:
  portal_logs:
  painel_storage:
