# Stack para Portainer / docker compose
#
# MadeForte: portal-fornecedores(-2/-3) → DB madeforte01, CLIENTE_ID=1
# Boro: efornecedorboro1..3 → DB boro (RDS), CLIENTE_ID=0 (single-tenant)
# O painel liga só a quantidade escolhida por cliente.

x-robo-base: &robo-base
  build:
    context: .
    dockerfile: Dockerfile
  image: portal-fornecedores:latest
  restart: unless-stopped
  shm_size: "512mb"

x-robo-env: &robo-env
  CLIENTE: ${CLIENTE:-madeforte}
  CLIENTE_ID: ${CLIENTE_ID:-1}
  DB_HOST: ${DB_HOST}
  DB_PORT: ${DB_PORT:-3306}
  DB_USER: ${DB_USER}
  DB_PASSWORD: ${DB_PASSWORD}
  DB_NAME: ${DB_NAME}
  PORTAL_URL: ${PORTAL_URL:-https://portal.e-fornecedores.ind.br/}
  PROXY: ${PROXY:-}
  WEBSHARE_API_TOKEN: ${WEBSHARE_API_TOKEN:-}
  WEBSHARE_PLAN_ID: ${WEBSHARE_PLAN_ID:-}
  CLOAKBROWSER_LICENSE_KEY: ${CLOAKBROWSER_LICENSE_KEY:-}
  USAR_CLOAKBROWSER: ${USAR_CLOAKBROWSER:-true}
  CLOAK_HUMANIZE: ${CLOAK_HUMANIZE:-true}
  CLOAK_HUMAN_PRESET: ${CLOAK_HUMAN_PRESET:-careful}
  CLOAK_GEOIP: ${CLOAK_GEOIP:-true}
  MODO_NOTURNO_INICIO_HORA: ${MODO_NOTURNO_INICIO_HORA:-21}
  MODO_NOTURNO_FIM_HORA: ${MODO_NOTURNO_FIM_HORA:-6}
  MODO_NOTURNO_CADENCIA_SEG: ${MODO_NOTURNO_CADENCIA_SEG:-180}
  MODO_NOTURNO_FATOR_PAUSA: ${MODO_NOTURNO_FATOR_PAUSA:-2.5}
  MODO_NOTURNO_REUSO_PESQUISA_SEG: ${MODO_NOTURNO_REUSO_PESQUISA_SEG:-600}
  USAR_CHROME_SISTEMA: ${USAR_CHROME_SISTEMA:-true}
  HEADLESS: ${HEADLESS:-false}
  DOCKER: "true"
  TZ: ${TZ:-America/Sao_Paulo}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:-}
  WHATSAPP_API_URL: ${WHATSAPP_API_URL:-https://api.reservaai.com.br/api}
  WHATSAPP_API_TOKEN: ${WHATSAPP_API_TOKEN:-}
  PAINEL_URL_PUBLICA: ${PAINEL_URL_PUBLICA:-https://madeforte.reservaai.com.br}

x-robo-boro-env: &robo-boro-env
  CLIENTE: boro
  CLIENTE_ID: "0"
  DB_HOST: ${BORO_DB_HOST:-reservaai-data.cgns57eoufkz.us-east-1.rds.amazonaws.com}
  DB_PORT: ${BORO_DB_PORT:-3306}
  DB_USER: ${BORO_DB_USER:-robo}
  DB_PASSWORD: ${BORO_DB_PASSWORD}
  DB_NAME: ${BORO_DB_NAME:-boro}
  PORTAL_URL: ${PORTAL_URL:-https://portal.e-fornecedores.ind.br/}
  PROXY: ${PROXY_BORO:-${PROXY:-}}
  WEBSHARE_API_TOKEN: ${WEBSHARE_API_TOKEN:-}
  WEBSHARE_PLAN_ID: ${WEBSHARE_PLAN_ID:-}
  CLOAKBROWSER_LICENSE_KEY: ${CLOAKBROWSER_LICENSE_KEY:-}
  USAR_CLOAKBROWSER: ${USAR_CLOAKBROWSER:-true}
  CLOAK_HUMANIZE: ${CLOAK_HUMANIZE:-true}
  CLOAK_HUMAN_PRESET: ${CLOAK_HUMAN_PRESET:-careful}
  CLOAK_GEOIP: ${CLOAK_GEOIP:-true}
  MODO_NOTURNO_INICIO_HORA: ${MODO_NOTURNO_INICIO_HORA:-21}
  MODO_NOTURNO_FIM_HORA: ${MODO_NOTURNO_FIM_HORA:-6}
  MODO_NOTURNO_CADENCIA_SEG: ${MODO_NOTURNO_CADENCIA_SEG:-180}
  MODO_NOTURNO_FATOR_PAUSA: ${MODO_NOTURNO_FATOR_PAUSA:-2.5}
  MODO_NOTURNO_REUSO_PESQUISA_SEG: ${MODO_NOTURNO_REUSO_PESQUISA_SEG:-600}
  USAR_CHROME_SISTEMA: ${USAR_CHROME_SISTEMA:-true}
  HEADLESS: ${HEADLESS:-false}
  DOCKER: "true"
  TZ: ${TZ:-America/Sao_Paulo}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:-}
  WHATSAPP_API_URL: ${WHATSAPP_API_URL:-https://api.reservaai.com.br/api}
  WHATSAPP_API_TOKEN: ${WHATSAPP_API_TOKEN:-}
  PAINEL_URL_PUBLICA: ${BORO_PAINEL_URL_PUBLICA:-https://efornecedor.reservaai.com.br}

services:
  portal-fornecedores:
    <<: *robo-base
    container_name: portal-fornecedores
    volumes:
      - portal_logs:/app/logs
    environment:
      <<: *robo-env
      ROBO_SLOT: "1"

  portal-fornecedores-2:
    <<: *robo-base
    container_name: portal-fornecedores-2
    volumes:
      - portal_logs:/app/logs
    environment:
      <<: *robo-env
      ROBO_SLOT: "2"
      PROXY: ${PROXY_2:-${PROXY:-}}

  portal-fornecedores-3:
    <<: *robo-base
    container_name: portal-fornecedores-3
    volumes:
      - portal_logs:/app/logs
    environment:
      <<: *robo-env
      ROBO_SLOT: "3"
      PROXY: ${PROXY_3:-${PROXY:-}}

  efornecedorboro1:
    <<: *robo-base
    container_name: efornecedorboro1
    volumes:
      - portal_logs_boro:/app/logs
    environment:
      <<: *robo-boro-env
      ROBO_SLOT: "1"

  efornecedorboro2:
    <<: *robo-base
    container_name: efornecedorboro2
    volumes:
      - portal_logs_boro:/app/logs
    environment:
      <<: *robo-boro-env
      ROBO_SLOT: "2"
      PROXY: ${PROXY_BORO_2:-${PROXY_BORO:-${PROXY:-}}}

  efornecedorboro3:
    <<: *robo-base
    container_name: efornecedorboro3
    volumes:
      - portal_logs_boro:/app/logs
    environment:
      <<: *robo-boro-env
      ROBO_SLOT: "3"
      PROXY: ${PROXY_BORO_3:-${PROXY_BORO:-${PROXY:-}}}

  painel:
    build:
      context: ./painel
      dockerfile: Dockerfile
    image: portal-fornecedores-painel:latest
    container_name: portal-fornecedores-painel
    restart: unless-stopped
    ports:
      - "${PAINEL_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --connect-timeout 2 --max-time 3 http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 45s
    environment:
      APP_NAME: "Portal Fornecedores"
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${PAINEL_APP_KEY}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${PAINEL_APP_URL:-http://localhost:8080}
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Sao_Paulo}
      TZ: ${TZ:-America/Sao_Paulo}
      DB_CONNECTION: mysql
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_NAME}
      DB_USERNAME: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      SESSION_DRIVER: file
      CACHE_STORE: file
      ROBO_PORTAINER_URL: ${ROBO_PORTAINER_URL:-}
      ROBO_PORTAINER_API_KEY: ${ROBO_PORTAINER_API_KEY:-}
      ROBO_PORTAINER_ENDPOINT_ID: ${ROBO_PORTAINER_ENDPOINT_ID:-1}
      ROBO_CONTAINER_NAME: ${ROBO_CONTAINER_NAME:-portal-fornecedores}
      ROBO_CONTAINER_NAMES: ${ROBO_CONTAINER_NAMES:-portal-fornecedores,portal-fornecedores-2,portal-fornecedores-3}
      ROBO_USAR_DOCKER_CLI: ${ROBO_USAR_DOCKER_CLI:-true}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@madeforte.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123456}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - painel_storage:/var/www/html/storage
      - portal_logs:/var/robo-logs:ro
      - portal_logs_boro:/var/robo-logs-boro:ro

volumes:
  portal_logs:
  portal_logs_boro:
  painel_storage:
